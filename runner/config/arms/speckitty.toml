name = "speckitty"
tool = "spec-kitty/spec-kitty"
version = "3.2.7"
citation = "CANDIDATES §1.4 (+ beads §2.1)"
image = "bakeoff-arm-speckitty:1"
tracker = "beads"
repo_name = "bakeoff-specs-speckitty"
# Provisional ruling (Task 11 FR1; the owner may flip it): spec-kitty's SaaS-sync flag is OFF in arm sessions — the
# conservative default, and what a user following the 3.2.7 docs gets. THIS is the switch: "1" makes the `tracker`
# command group (and spec-kitty's hosted-sync code paths) visible to the arm; spec-kitty reads only 1/true/yes/y/on as
# on. Setup and the verify script set it to 1 only for their own `tracker` commands.
# SPEC_KITTY_NO_UPGRADE_CHECK: no PyPI upgrade-check notice (as openspec's OPENSPEC_TELEMETRY=0).
env = { SPEC_KITTY_ENABLE_SAAS_SYNC = "0", SPEC_KITTY_NO_UPGRADE_CHECK = "1" }

[egress]
setup = []
run = []

# CANDIDATES §1.4 items 2-3 + beads (§2.1): init, verify-setup, bd init, bd setup claude, then the beads tracker
# binding with its recorded egress decision (review G1, G2). Verified offline against the pinned 3.2.7 (Task 11):
# the `tracker` group exists only with SPEC_KITTY_ENABLE_SAAS_SYNC=1 (its ADR 2026-02-27 "CLI tracker surface gated
# by SaaS sync flag"); a local provider binds with `--provider beads --workspace <id>` (`--credential` is optional:
# the connector then runs `bd` in the repo); the egress decision is the `tracker.egress` key of .kittify/config.yaml,
# `refused` | `permitted`, which no command writes: spec-kitty's own remedy text says "record `tracker.egress:
# permitted` in this project's own .kittify/config.yaml". The last step records it through spec-kitty's own config
# loader/saver (so it cannot write a shape spec-kitty would not read) and refuses a binding that is not beads.
# `bd metrics off` (design §6, telemetry off): bd 1.3.0 sends anonymous usage metrics by default (its first-run
# notice; `bd metrics` names the endpoint) — the opt-out is user-scope, ~/.config/bd/config.yaml, so it runs first.
[setup]
shell = ["spec-kitty init . --ai claude",
         "spec-kitty verify-setup",
         "bd metrics off",
         "bd init",
         "bd setup claude",
         "SPEC_KITTY_ENABLE_SAAS_SYNC=1 spec-kitty tracker bind --provider beads --workspace beads",
         '''/opt/venvs/speckitty/bin/python -c 'from pathlib import Path; from specify_cli.tracker.config import load_tracker_config, save_tracker_config, EGRESS_PERMITTED; r = Path("."); c = load_tracker_config(r); assert c.provider == "beads", f"tracker is bound to {c.provider!r}, not beads"; c.egress = EGRESS_PERMITTED; save_tracker_config(r, c)' ''']
agent = ["/spec-kitty.charter {principles}"]
post_shell = []
plugins = []
# Every setup file both inits create, measured in two offline setups (Task 11 FR1): spec-kitty init writes .claude/,
# .kittify/, .gitignore, .gitattributes, .claudeignore and its /spec-kitty.* commands and most skills user-scope
# (CLAUDE_CONFIG_DIR); bd init writes CLAUDE.md (beads section), AGENTS.md, .agents/ (beads skill), .codex/, .cursor/,
# .beads/ (config.yaml and hooks/ are setup; embeddeddolt/ and metadata.json are the database and its ids, and
# .beads.gate.lock is a lock), and `bd metrics off` writes ~/.config/bd. Nothing writes the home's settings.json.
manifest_paths = [".claude", ".kittify", ".gitignore", ".gitattributes", ".claudeignore",
                  "CLAUDE.md", "AGENTS.md", ".agents", ".codex", ".cursor", ".beads/config.yaml", ".beads/hooks",
                  "~/.claude/commands", "~/.claude/skills", "~/.config/bd"]
volatile_paths = [
  { path = ".kittify/config.yaml", kind = "install-stamp", why = "per-run project uuid, node_id and build_id; its tracker keys are machine-checked (speckitty.tracker-binding, tracker-egress, hosted-egress-refused)" },
  { path = ".kittify/metadata.yaml", kind = "install-stamp", why = "per-run values (differs between two identical offline setups; project identity, as config.yaml)" },
  { path = ".kittify/canonical-events.jsonl", kind = "install-stamp", why = "the init event log: per-run event ids and times" },
  { path = ".kittify/skills-manifest.json", kind = "install-stamp", why = "per-skill `installed_at` timestamps; the skills themselves are compared" },
  { path = ".kittify/charter", kind = "model-written", why = "/spec-kitty.charter writes it; OV5 reads it" },
]

[drive]
entry = "/spec-kitty.specify {handoff}"
bug_entry = "/spec-kitty.specify {handoff}"
must_run = ["/spec-kitty.accept", "/spec-kitty.merge"]
must_run_source = "CANDIDATES §1.4 Workflow stages: … implement → review per WP → accept → consolidate/merge"
fresh_session_before = []
export_after = ""
