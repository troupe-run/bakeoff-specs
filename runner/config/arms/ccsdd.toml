name = "ccsdd"
tool = "gotalab/cc-sdd"
version = "3.1.0"
citation = "CANDIDATES §1.7a"
image = "bakeoff-arm-ccsdd:1"
tracker = "github"
repo_name = "bakeoff-specs-ccsdd"
env = {}

[egress]
setup = []
run = ['^api\.github\.com$']

# CANDIDATES §1.7a: `npx cc-sdd@latest --claude-skills` → the pinned 3.1.0 bin (same flags); then /kiro-steering.
# Verified offline in bakeoff-arm-ccsdd:1 (Task 11): non-TTY, 50 files (CLAUDE.md included), byte-identical across runs.
[setup]
shell = ["cc-sdd --claude-skills"]
agent = ["/kiro-steering\n\n{principles}"]
post_shell = []
plugins = []
manifest_paths = [".claude", ".kiro/settings", "CLAUDE.md"]

[drive]
entry = "/kiro-discovery {handoff}"
bug_entry = "/kiro-discovery {handoff}"
must_run = ["/kiro-validate-impl"]
must_run_source = "CANDIDATES §1.7a Workflow: … → /kiro-impl → /kiro-validate-impl (GO/NO-GO)"
fresh_session_before = []
export_after = ""
# N.a discovery stop (design §5): the method's own spec/plan/tracker folders; edits here are not code edits.
# Every arm also gets pins.toml [discovery] docs_paths.
spec_paths = [
  { path = ".kiro/", why = "Kiro specs (.kiro/specs/<feature>/: requirements, design, tasks) and steering (.kiro/steering/), CANDIDATES §1.7a Artefacts" },
]
