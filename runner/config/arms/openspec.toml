name = "openspec"
tool = "Fission-AI/OpenSpec"
version = "1.13.2"
citation = "CANDIDATES §1.3"
image = "bakeoff-arm-openspec:1"
tracker = "github"
repo_name = "bakeoff-specs-openspec"
env = { OPENSPEC_TELEMETRY = "0" }

[egress]
setup = []
run = ['^api\.github\.com$']

# CANDIDATES §1.3: init --tools claude; telemetry off (design §6); project context in config.yaml (G3, OD22)
[setup]
shell = ["openspec init --tools claude",
         "openspec config set telemetry.enabled false",
         '''python3 -c 'import pathlib; p = pathlib.Path("openspec/config.yaml"); t = p.read_text() if p.exists() else ""; assert "\ncontext:" not in "\n" + t, "config.yaml already has a context"; body = pathlib.Path("/setup/project-principles.md").read_text(); p.write_text(t.rstrip("\n") + ("\n" if t else "") + "context: |\n" + "".join("  " + l + "\n" for l in body.splitlines()))' ''']
agent = []
post_shell = []
plugins = []
# `openspec config set` writes the global config in the arm's home (~/.config/openspec/config.json): a setup file too
manifest_paths = [".claude", "openspec", "~/.config/openspec"]

[drive]
entry = "{handoff}"
bug_entry = "{handoff}"
must_run = []
must_run_source = ""
fresh_session_before = []
export_after = ""
