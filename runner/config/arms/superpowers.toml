name = "superpowers"
tool = "obra/superpowers"
version = "6.4.2"
citation = "CANDIDATES §1.1"
image = "bakeoff-arm-superpowers:1"
tracker = "github"
repo_name = "bakeoff-specs-superpowers"
env = {}

[egress]
setup = []
run = ['^api\.github\.com$']

# CANDIDATES §1.1: no init, no constitution; a SessionStart hook; documented smoke test (§1.1 item 3)
[setup]
shell = []
agent = []
post_shell = []
plugins = [{ name = "superpowers", marketplace = "anthropics/claude-plugins-official", install = "superpowers@claude-plugins-official", version = "6.4.2", repo = "obra/superpowers", tag = "v6.4.2", sha = "8ca22dba9a94f28898bbce59f2537ff4d87c747d", subdir = "" }]
smoke = { prompt = "Let's make a react todo list", expect_skill = "brainstorming" }
# Nothing in the repo: route B loads the vendored plugin with --plugin-dir, route A installs into the arm's home
# (hashed via ~/.claude/plugins/cache by manifest_full), the smoke session runs in /work/smoke and is deleted.
# So no `.claude` here: a listed path setup does not create fails the manifest check (Task 9 fix round 1).
manifest_paths = []

[drive]
# skills auto-trigger (CANDIDATES §1.1: no slash-command stages to run by hand)
entry = "{handoff}"
bug_entry = "{handoff}"
must_run = ["/superpowers:finishing-a-development-branch"]
must_run_source = "CANDIDATES §1.1 Workflow stages: … → requesting-code-review → finishing-a-development-branch"
fresh_session_before = []
export_after = ""
# N.a discovery stop (design §5): the method's own spec/plan/tracker folders; edits here are not code edits.
# Every arm also gets pins.toml [discovery] docs_paths.
spec_paths = [
  { path = "docs/superpowers/", why = "brainstorming's design docs (docs/superpowers/specs/) and writing-plans' plans (docs/superpowers/plans/), CANDIDATES §1.1 Artefacts" },
]
