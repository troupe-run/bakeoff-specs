name = "speckit"
tool = "github/spec-kit"
version = "1.0.12"
citation = "CANDIDATES §1.2"
image = "bakeoff-arm-speckit:1"
tracker = "github"
repo_name = "bakeoff-specs-speckit"
env = {}

[egress]
setup = []
run = ['^api\.github\.com$']

# CANDIDATES §1.2 (existing-repo route: the repo holds only its empty initial commit); `extension add bug` is the
# documented bug process (§1.2 item 4, used at step 6 — OD5). Both verified offline in bakeoff-arm-speckit:1 (Task 11).
[setup]
shell = ["specify init --here --force --integration claude", "specify extension add bug"]
agent = ["/speckit-constitution {principles}"]
post_shell = []
plugins = []
manifest_paths = [".claude", ".specify"]
# Left out of the pass-2 manifest comparison (Task 11 FR1): each install-stamp entry is proven to differ between two
# identical offline setups (test_volatile_paths_are_exactly_what_differs_between_two_offline_setups)
volatile_paths = [
  { path = ".specify/extensions/.registry", kind = "install-stamp", why = "the bug extension's `installed_at` timestamp" },
  { path = ".specify/integrations/claude.manifest.json", kind = "install-stamp", why = "per-file install timestamps" },
  { path = ".specify/integrations/speckit.manifest.json", kind = "install-stamp", why = "per-file install timestamps" },
  { path = ".specify/workflows/workflow-registry.json", kind = "install-stamp", why = "the workflow's install timestamp" },
  { path = ".specify/memory/constitution.md", kind = "model-written", why = "/speckit-constitution writes it; OV1 reads it" },
]

[drive]
entry = "/speckit-specify {handoff}"
bug_entry = "/speckit-bug-assess {handoff}"
must_run = ["/speckit-converge"]
must_run_source = "CANDIDATES §1.2 Workflow stages: repeat implement → converge until convergence reports Converged"
fresh_session_before = []
export_after = "/speckit-tasks"          # OD24 B: send /speckit-taskstoissues once after tasks ("" = OD24 A)
