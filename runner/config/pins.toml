# runner/config/pins.toml — single source of truth for every pinned value (design §2, §11)
[claude]
version = "2.1.281"
model = "claude-opus-5-5"
accepted_models = ["claude-opus-5-5"]        # probe P1 confirms the exact transcript string
synthetic_models = ["<synthetic>"]           # Claude Code's own non-model messages; counted, not faults
max_retries = 4
permission_mode = "bypassPermissions"        # OD11
disallowed_tools = ["WebSearch", "WebFetch", "AskUserQuestion"]   # OD10, OD11
binary_sha256 = "dd27b36438a4fed1670cd29bad2fda6a73b628b6da55443e5c2f647fe6ed328f"                           # written by `runner images pin` (Task 2); build refuses while empty

[beads]
# @beads/bd's postinstall downloads its ~143MB native binary straight from GitHub releases with NO checksum
# of its own (fix-round-1 item 1). `runner images pin` resolves this by actually installing it and hashing
# the real native binary (not its 1.3KB JS wrapper); the speckitty Dockerfile verifies with `sha256sum -c`
# and fails the build on mismatch. Platform/arch-specific to the pinning host, like every other digest here.
sha256 = "9e485eabbdb7ac39b0ca6abb13f394432a3d030460703be8565caaff662d82d3"

[images]
base = "bakeoff-base:cc2.1.281"
tester = "bakeoff-tester:3"                 # :3 = no reference; arm code runs here (Task 18 fix round 3)
tester_ref = "bakeoff-tester-ref:1"          # tester + reference, harness reference runs only
proxy = "bakeoff-egress:1"
dryrun = "bakeoff-arm-dryrun:1"
uv = "0.12.19"
gh = "2.101.0"
node_major = "22"
python = "3.12"
alpine = "3.20"                              # proxy sidecar base (review m1: pinned by digest like every other FROM)
tinyproxy = "1.11.2-r0"                               # apk package version; written by `runner images pin`

[images.digests]                             # written by `runner images pin` (Task 2); build refuses while empty
debian = "sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251"
node = "sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c"
uv = "sha256:04d046b13e60d6bcec73cbc5e1cad25d680dea90c8573340950a0ac2d1aef424"
alpine = "sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc"

[limits]
turn_seconds = 28800                         # OD14 B (A: 14400)
exchanges_per_attempt = 250                  # OD14 B (A: 80)
owner_reclassifies_first_breach = true       # OD14 B (A: false)
attempts_no_progress = 3                     # design §9
mutation_seconds = 3600                      # OD15 A cap; also the B safety cap
mutation_sample = 200                        # OD15 B (A: 0 = no sampling)
load_factor = 0.5                            # idle-machine preflight (host and Docker VM)
cpus = "4"
memory = "8g"
pids = 2048
transient_backoff = [60, 300, 900]           # review C-4: in-place retries of transient API errors
suite_resource_arms = 2                      # design §9 (owner, 2026-09-29): arms exhausting resources at one step
                                             # -> harness fault `suite-resource:<step>`, the bake-off halts (Task 23)

[discovery]
# N.a (design §5, owner 2026-09-29): the discovery run stops at the arm's first approval request or its first edit to
# code outside its spec and docs paths. These docs paths hold for every arm; each arm adds its own method's folders
# (`[drive] spec_paths` in arms/<arm>.toml). A path ending in `/` is a directory prefix; anything else is an fnmatch
# pattern on the repo-relative path (`*` crosses `/`).
docs_paths = [
  { path = "docs/", why = "project documentation, never the CLI's code" },
  { path = "*.md", why = "Markdown anywhere (README, CLAUDE.md, AGENTS.md, notes) is prose, not code" },
  { path = ".claude/", why = "Claude Code's project settings and the method's installed commands, not the CLI's code" },
  { path = ".venv/", why = "`uv sync` output: an environment, not an edit (the initial repo has no .gitignore)" },
  { path = "*__pycache__/*", why = "bytecode Python writes on import, not an edit" },
  { path = ".pytest_cache/", why = "tool cache" },
  { path = ".mypy_cache/", why = "tool cache" },
  { path = ".ruff_cache/", why = "tool cache" },
]

[plugins]
route = "plugin-dir"                         # OD9 B (A: "marketplace")

[egress]
# Anchored ERE host patterns for tinyproxy (spike B Q3). Setup = install/init time; run = step sessions.
setup_common = ['^api\.anthropic\.com$', '^registry\.npmjs\.org$', '^pypi\.org$', '^files\.pythonhosted\.org$',
                '^github\.com$', '^api\.github\.com$', '^codeload\.github\.com$', '^objects\.githubusercontent\.com$',
                '^raw\.githubusercontent\.com$', '^release-assets\.githubusercontent\.com$']
run_common = ['^api\.anthropic\.com$', '^pypi\.org$', '^files\.pythonhosted\.org$']
po = ['^api\.anthropic\.com$']
tester_prep = ['^pypi\.org$', '^files\.pythonhosted\.org$']
