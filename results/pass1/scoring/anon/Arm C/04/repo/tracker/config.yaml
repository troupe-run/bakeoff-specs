# tracker Configuration File
# This file configures default behavior for all tracker-cli commands in this repository
# All settings can also be set via environment variables (tracker-cli_* prefix)
# or overridden with command-line flags

# Issue prefix for this repository (used by tracker-cli init)
# If not set, tracker-cli init will auto-detect from directory name
# Example: issue-prefix: "myproject" creates issues like "myproject-1", "myproject-2", etc.
# issue-prefix: ""

# Use no-db mode: JSONL-only, no tracker database
# When true, tracker/issues.jsonl is the only local store
# no-db: false

# Enable JSON output by default
# json: false

# Feedback title formatting for mutating commands (create/update/close/dep/edit)
# 0 = hide titles, N > 0 = truncate to N characters
# output:
#   title-length: 255

# Default actor for audit trails (overridden by tracker_ACTOR or --actor)
# actor: ""

# Optional JSONL sidecar for explicit agent/tool interaction audit records.
# Issue history is always recorded in the database and is visible with
# tracker-cli history <id> --events; this only controls tracker/interactions.jsonl.
# audit:
#   enabled: false

# Export events (audit trail) to tracker/events.jsonl on each flush/sync
# When enabled, new events are appended incrementally using a high-water mark.
# Use 'tracker-cli export --events' to trigger manually regardless of this setting.
# events-export: false

# Multi-repo configuration (experimental - tracker-cli-307)
# Allows hydrating from multiple repositories and routing writes to the correct database
# repos:
#   primary: "."  # Primary repo (where this database lives)
#   additional:   # Additional repos to hydrate from (read-only)
#     - ~/tracker-planning  # Personal planning repo
#     - ~/work-planning   # Work planning repo

# tracker-native backup (periodic backup for off-machine recovery)
# This is full database backup only. Cross-machine sync uses tracker remotes.
# backup:
#   enabled: false     # Disable auto-backup entirely
#   interval: 15m      # Minimum time between auto-backups
#   git-push: false    # Disable git push (backup locally only)
#   git-repo: ""       # Separate git repo for backups (default: project repo)

# Optional JSONL auto-export for viewers, interchange, and issue-level migration.
# Disabled by default; enable only when an integration needs fresh tracker/issues.jsonl.
# Use relative paths under tracker/ for JSONL import/export filenames.
# export:
#   auto: false
#   path: issues.jsonl
#   interval: 60s
#   git-add: false
# import:
#   path: issues.jsonl

# Integration settings (access with 'tracker-cli config get/set')
# Non-secret keys (stored in the database):
# - jira.url, jira.project
# - linear.team_id
# - github.org, github.repo
#
# Secret keys (stored in this file but prefer env vars to avoid git exposure):
# - linear.api_key  → use LINEAR_API_KEY env var instead
# - github.token    → use GITHUB_TOKEN env var instead

sync.remote: "/home/actor/origin.git"