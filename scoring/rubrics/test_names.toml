# scoring/rubrics/test_names.toml — code and test quality: does each test's name say what its body actually asserts?
# A name that overclaims is worse than a vague one: it marks the question as answered. Checked set: every test the
# step added or changed, in diff order, up to the first 30.
dimension = "code_quality"
unit = "step"
evidence = ["repo"]

[levels]
0 = "Names do not describe behaviour (test_1, test_set, test_it_works), or most checked names claim something their body does not assert."
1 = "More than a quarter of checked names overclaim (the body would still pass if the named claim were false) or describe a different behaviour from the one asserted; or most names only repeat the function under test."
2 = "Most names describe the asserted behaviour, but two or more overclaim (e.g. 'preserves comments' while asserting only the new value) or are too vague to tell what failed."
3 = "No checked name overclaims; every one describes a behaviour its body asserts, but one or two are vague or say less than the body checks."
4 = "Every checked name states a specific behaviour (the condition and the expected result) and the body asserts exactly that, at the level claimed (a byte-for-byte claim is checked byte for byte); the names alone read as a spec of the step."

[[lens]]
name = "falsifier"
perspective = "Read each checked test's name as a claim. Ask: if the claim were false, would the body fail? Record per test: claim checked, overclaims (cite the missing assertion), or underclaims. Score from the overclaims first. The checked tests: every test this step added or changed, in diff order, up to the first 30."

[[lens]]
name = "spec reader"
perspective = "Read only the names of the checked tests, as a list. What behaviour do they describe? Compare that with the step's request and contract sections. Are the names specific enough to tell which rule each test pins? The checked tests: every test this step added or changed, in diff order, up to the first 30."

[[lens]]
name = "failure triager"
perspective = "CI reports one of these tests failed and gives you only its name. For each checked test, would you know what behaviour broke without opening the body? Then open the body: was your guess right? The checked tests: every test this step added or changed, in diff order, up to the first 30."
