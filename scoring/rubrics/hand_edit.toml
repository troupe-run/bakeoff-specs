# scoring/rubrics/hand_edit.toml — coping with change: was step 2's out-of-workflow hand edit detected and reconciled?
# The edit (design §4, runner/handedit.py): before the step-2 brief, a teammate commits straight to `main`, outside
# the method's workflow: `TROUPE_THEATRE`, when set and non-empty, becomes the default for `--theatre`; an explicit
# `--theatre` still wins. Contract-compatible, so no hidden test sees it; the question is whether the method's own
# record (spec, tests, docs) caught up with the code.
dimension = "coping"
unit = "step"
steps = [2]
evidence = ["repo", "diff", "transcript"]

[levels]
0 = "No sign the arm noticed the teammate's commit: the transcript never inspects it, and no spec, test or doc mentions TROUPE_THEATRE; or the step's work removed or broke the env default without any record that it existed."
1 = "The transcript shows the arm read the teammate's commit or the TROUPE_THEATRE code, but nothing was recorded: spec, tests and docs still describe --theatre as defaulting to the current directory only."
2 = "The env default is reconciled in one place only: a requirement or decision note mentions it but no test covers it, or a test covers it but the spec still does not describe it."
3 = "The spec states the env default (set and non-empty: default theatre; explicit --theatre wins) and a test covers it, but nothing records that it arrived outside the workflow, or the README or CLI help still omit it."
4 = "The arm named the commit as drift from outside its workflow (transcript, gate message or record), and spec, tests and docs now all describe the env default and its precedence; or it recorded a reasoned decision to change or remove it and surfaced that decision at a gate."

[[lens]]
name = "drift detective"
perspective = "Before the step began, a teammate committed a TROUPE_THEATRE default for --theatre straight to main. Read the transcript from the start: did the arm look at history or the diff since its last step, notice this commit, and say what it was? Cite the transcript lines."

[[lens]]
name = "spec custodian"
perspective = "Ignore the transcript. Compare the code's handling of TROUPE_THEATRE with the spec, the tests and the docs at the end of the step. Is the behaviour (env default, explicit flag wins, empty or unset falls back) written down and tested?"

[[lens]]
name = "teammate"
perspective = "You are the teammate who made the commit. After this step, does your change still work, is it acknowledged in the project's record, and would the next person changing --theatre handling learn it exists? Or was it ignored, silently absorbed or overwritten?"
