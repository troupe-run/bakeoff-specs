# scoring/rubrics/step6_spec_trace.toml — traceability: does step 6's bug fix leave a trace in the spec?
# The bug (scenario/steps/06-bug-alias.md, delivered as an issue in the arm's tracker): setting a value through a
# YAML alias silently changed the anchor and every other alias. Contract 'Aliases (from step 6)': set at the anchor
# changes everyone; set through an alias exits 3 naming --expand-alias; --expand-alias makes a block copy; merge
# keys are never written.
dimension = "traceability"
unit = "step"
steps = [6]
evidence = ["repo", "diff"]

[levels]
0 = "No spec or requirement text changed: nothing in the repo's spec records the alias rules, and any text calling aliases out of scope or describing the old behaviour still stands."
1 = "The fix is recorded only outside the spec (a commit message, a tracker comment or a code comment); the spec is silent on aliases or still calls them out of scope."
2 = "The spec mentions alias behaviour but incompletely (e.g. the refusal but not --expand-alias, or not that a set at the anchor changes every alias), or the new text is not linked to the report or to any test."
3 = "The spec states the alias rules (set at the anchor changes everyone; set through an alias refused with a pointer to --expand-alias; --expand-alias makes a copy; merge keys never written) and a regression test covers them, but the spec does not reference the bug report, or one rule is missing."
4 = "The spec states every alias rule, references the bug report, links a regression test that reproduces the reported scenario, and replaces any earlier text treating aliases as out of scope."

[[lens]]
name = "bug reporter"
perspective = "You filed the alias bug. Starting from your report (and the tracker entry if the repo references it), can you find where it changed the spec, and does the spec now say what you asked for?"

[[lens]]
name = "future implementer"
perspective = "You are about to rework how `set` resolves paths and you read the spec only, not the code or tests. Would you learn the alias rules and so avoid reintroducing the bug?"

[[lens]]
name = "auditor"
perspective = "Classify the fix from the diff and the commit order: spec changed first then code; code and spec changed together; code fixed with the spec updated after the fact; or code-only. Then check the new spec text against the contract's Aliases rules, one by one."
