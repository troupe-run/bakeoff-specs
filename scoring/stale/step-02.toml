what = "Any requirement or design text stating `set`/`remove` events are produced only by the `set` command (history's event sources are import + set)"
why = "Contract 'Sync with files': reconcile emits `set`/`remove` events, and 'An include added by a hand edit is followed; its leaves appear as `set` events'"

[[stale]]
