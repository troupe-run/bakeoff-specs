# scoring/weights.toml — owner decisions 2026-10-05 (spec §2-§3). The only place weights live.
[dimensions]
coping = 20
correctness = 20
traceability = 10
interaction = 10
code_quality = 15
decision_quality = 10
setup = 10
time = 5

[parts.coping]
regressions = 7
stale_updated = 7
churn = 3
hand_edit = 3

[parts.traceability]          # equal split (spec: splits not given are equal)
req_test_code = 3.3333333333333335
change_reason = 3.3333333333333335
step6_spec_trace = 3.333333333333333

[parts.interaction]
question_value = 3.3333333333333335
research_first = 3.3333333333333335
gates = 3.333333333333333

[parts.code_quality]
mutation = 4               # owner, 2026-10-10: 5 -> 4 for size
types = 3                  # mypy --strict errors per 1,000 lines mypy checked (owner, 2026-10-10)
lint = 2                   # weighted ruff findings per 1,000 lines ruff checked (owner, 2026-10-10)
test_names = 4             # owner, 2026-10-10: 5 -> 4 for size
size = 2                   # concision: source lines (src, not tests) against the median arm (owner, 2026-10-10)

[parts.decision_quality]
choice = 6
process = 4

[parts.time]                  # owner, 2026-10-10: raw time and cost per step, against the median arm at the step
time = 2.5                    # scored run's arm working time (PO and the N.a discovery run excluded)
cost = 2.5                    # scored run's arm USD, cost.json "scored" (PO and the N.a discovery run excluded)

[parts.setup]
setup_effort = 4
fit = 4
violations = 2

[scales]
ratio_cap = 10.0           # log scale, capped at 10x worse and 10x better (spec §4): churn relative to control;
                           # time and cost relative to the median arm at the step (owner, 2026-10-10)
# types/lint (owner, 2026-10-10), the same for every arm and step: score = max(0, 1 - per_kloc / zero_per_kloc), where
# per_kloc is per 1,000 non-blank *.py lines the tool checked (quality/size.json: mypy usually src only, ruff src+tests).
types_zero_per_kloc = 10   # 10 mypy errors per 1,000 lines = 0
lint_zero_per_kloc = 10    # 10 weighted ruff findings per 1,000 lines = 0; harness ruleset (ruff.json), not the arm's
lint_safe_fix_weight = 0.1 # a ruff finding with a safe auto-fix counts 0.1; every other finding counts 1
# size (owner, 2026-10-10): source lines = quality/size.json type_lines (mypy's targets, src; tests not counted), m = the
# median of the measured arms at the step. x <= m: min(1, 0.5 + 0.5 * log(m/x) / log(1/size_plateau_fraction));
# x > m: max(0, 0.5 * (1 - log(x/m) / log(size_zero_multiple))). 0.5 at the median, 1 at half of it and below, 0 at 4x.
size_plateau_fraction = 0.5
size_zero_multiple = 4
# decision ratings (owner, 2026-10-09): 1 wrong or harmful .. 5 what you'd want; n/a is not scored
rating_1 = 0.0
rating_2 = 0.25
rating_3 = 0.5
rating_4 = 0.75
rating_5 = 1.0

[report]
outlier_factor = 3.0       # report.md marks time/cost >= 3x or <= 1/3 of the median of the arms
