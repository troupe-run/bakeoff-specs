# scoring/weights.toml — owner decisions 2026-10-05 (spec §2-§3). The only place weights live.
[dimensions]
coping = 20
correctness = 20
traceability = 10
interaction = 10
code_quality = 15
decision_quality = 10
setup = 10
time = 5

[parts.coping]
regressions = 7
stale_updated = 7
churn = 3
hand_edit = 3

[parts.traceability]          # equal split (spec: splits not given are equal)
req_test_code = 3.3333333333333335
change_reason = 3.3333333333333335
step6_spec_trace = 3.333333333333333

[parts.interaction]
question_value = 3.3333333333333335
research_first = 3.3333333333333335
gates = 3.333333333333333

[parts.code_quality]
mutation = 5
mypy_lint = 5
test_names = 5

[parts.decision_quality]
choice = 6
process = 4

[parts.setup]
setup_effort = 4
fit = 4
violations = 2

[scales]
ratio_cap = 10.0           # log scale relative to control: capped at 10x worse and 10x better (spec §4)
lint_per_error = 0.05      # mypy + ruff: 1 - 0.05 per error, floor 0 (20 errors = 0)
violation_per_item = 0.25  # arm violations: 1 - 0.25 per violation, floor 0
rating_good = 1.0
rating_acceptable = 0.67
rating_poor = 0.0
